<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Anuitas Sederhana</title>
    <!-- Tailwind CSS untuk tampilan modern, bersih & responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4">

    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">
        
        <!-- Header / Judul -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-900">Kalkulator Anuitas</h1>
            <p class="text-slate-500 text-sm mt-1">Hitung simulasi angsuran bulanan & rincian jadwal pelunasan</p>
        </div>

        <!-- Form Input -->
        <form id="annuityForm" onsubmit="event.preventDefault(); calculateAnnuity();" class="space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Pilihan Mata Uang -->
                <div>
                    <label for="currency" class="block text-sm font-medium text-slate-700 mb-1">Mata Uang</label>
                    <select id="currency" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="Rp">Rupiah (Rp)</option>
                        <option value="$">USD ($)</option>
                        <option value="€">EUR (€)</option>
                    </select>
                </div>

                <!-- Pokok Pinjaman -->
                <div>
                    <label for="principal" class="block text-sm font-medium text-slate-700 mb-1">Pokok Pinjaman (Plafon)</label>
                    <input type="number" id="principal" value="100000000" min="1" placeholder="Contoh: 100000000" required class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Suku Bunga -->
                <div>
                    <label for="rate" class="block text-sm font-medium text-slate-700 mb-1">Suku Bunga (% per tahun)</label>
                    <input type="number" id="rate" value="10" step="0.01" min="0" placeholder="Contoh: 10" required class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- Jangka Waktu (Tenor) -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label for="tenure" class="block text-sm font-medium text-slate-700 mb-1">Jangka Waktu</label>
                        <input type="number" id="tenure" value="12" min="1" required class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="tenureUnit" class="block text-sm font-medium text-slate-700 mb-1">Satuan</label>
                        <select id="tenureUnit" class="w-full rounded-lg border border-slate-300 p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="months">Bulan</option>
                            <option value="years">Tahun</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Tombol Hitung -->
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-sm mt-2">
                Hitung Anuitas
            </button>
        </form>

        <!-- Ringkasan Hasil -->
        <div id="resultSummary" class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3">
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                <p class="text-xs text-blue-600 font-medium uppercase">Angsuran per Bulan</p>
                <p id="monthlyPayment" class="text-lg font-bold text-blue-900 mt-1">-</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium uppercase">Total Pembayaran</p>
                <p id="totalPayment" class="text-lg font-bold text-slate-900 mt-1">-</p>
            </div>
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="text-xs text-slate-500 font-medium uppercase">Total Bunga</p>
                <p id="totalInterest" class="text-lg font-bold text-rose-600 mt-1">-</p>
            </div>
        </div>

        <!-- Tabel Amortisasi -->
        <div class="mt-6">
            <h2 class="text-base font-semibold text-slate-900 mb-3">Jadwal Angsuran (Amortisasi)</h2>
            <div class="overflow-x-auto rounded-xl border border-slate-200 max-h-80 overflow-y-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 uppercase text-xs font-semibold sticky top-0">
                        <tr>
                            <th class="px-3 py-2.5 text-center">Bulan</th>
                            <th class="px-3 py-2.5 text-right">Angsuran</th>
                            <th class="px-3 py-2.5 text-right">Bunga</th>
                            <th class="px-3 py-2.5 text-right">Pokok</th>
                            <th class="px-3 py-2.5 text-right">Sisa Pinjaman</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody" class="divide-y divide-slate-200 bg-white">
                        <!-- Diisi via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Script Logika Perhitungan -->
    <script>
        function formatCurrency(val, symbol) {
            return symbol + ' ' + Math.round(val).toLocaleString('id-ID');
        }

        function calculateAnnuity() {
            const symbol = document.getElementById('currency').value;
            const P = parseFloat(document.getElementById('principal').value);
            const annualRate = parseFloat(document.getElementById('rate').value) / 100;
            const tenure = parseInt(document.getElementById('tenure').value);
            const tenureUnit = document.getElementById('tenureUnit').value;

            if (isNaN(P) || isNaN(annualRate) || isNaN(tenure) || P <= 0 || tenure <= 0) {
                return;
            }

            const totalMonths = tenureUnit === 'years' ? tenure * 12 : tenure;
            const i = annualRate / 12;

            // Rumus Anuitas Bulanan
            let A = 0;
            if (i === 0) {
                A = P / totalMonths;
            } else {
                A = (P * i * Math.pow(1 + i, totalMonths)) / (Math.pow(1 + i, totalMonths) - 1);
            }

            let balance = P;
            let totalInterestPaid = 0;
            const scheduleBody = document.getElementById('scheduleBody');
            scheduleBody.innerHTML = '';

            for (let month = 1; month <= totalMonths; month++) {
                let interestPayment = balance * i;
                let principalPayment = A - interestPayment;
                balance -= principalPayment;

                if (balance < 0) balance = 0;
                totalInterestPaid += interestPayment;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50';
                tr.innerHTML = `
                    <td class="px-3 py-2 text-center font-medium text-slate-900">${month}</td>
                    <td class="px-3 py-2 text-right">${formatCurrency(A, symbol)}</td>
                    <td class="px-3 py-2 text-right text-rose-600">${formatCurrency(interestPayment, symbol)}</td>
                    <td class="px-3 py-2 text-right text-emerald-600">${formatCurrency(principalPayment, symbol)}</td>
                    <td class="px-3 py-2 text-right font-medium text-slate-900">${formatCurrency(balance, symbol)}</td>
                `;
                scheduleBody.appendChild(tr);
            }

            const totalPayment = P + totalInterestPaid;

            document.getElementById('monthlyPayment').textContent = formatCurrency(A, symbol);
            document.getElementById('totalPayment').textContent = formatCurrency(totalPayment, symbol);
            document.getElementById('totalInterest').textContent = formatCurrency(totalInterestPaid, symbol);
        }

        // Jalankan perhitungan awal secara otomatis
        window.onload = function() {
            calculateAnnuity();
        };
    </script>
</body>
</html>
